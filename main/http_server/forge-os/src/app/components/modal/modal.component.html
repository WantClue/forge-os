<ng-container *ngIf="isVisible">
    <div class="modal-backdrop" (click)="closable ? isVisible = false : null"></div>
    <div class="modal" role="dialog" aria-modal="true" [attr.aria-label]="headline">
        <header class="modal-head">
            <h2 class="modal-title">{{headline}}</h2>
            <button *ngIf="closable" type="button" class="modal-close" aria-label="Close" (click)="isVisible = false">
                <i class="pi pi-times"></i>
            </button>
        </header>

        <main class="modal-body">
            <ng-content></ng-content>
        </main>
    </div>
</ng-container>
