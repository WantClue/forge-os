<ng-container *ngIf="form != null">
    <form [formGroup]="form">

        <div class="field grid p-fluid">
            <label htmlFor="hostname" class="col-12 mb-2 md:col-3 md:mb-0">Hostname</label>
            <div class="col-12 md:col-9">
                <input pInputText id="hostname" type="text" formControlName="hostname" />
                <small>The name this miner shows on your network.</small>
            </div>
        </div>
        <div class="field grid p-fluid">
            <label htmlFor="ssid" class="col-12 mb-2 md:col-3 md:mb-0">Network name (SSID)</label>
            <div class="col-12 md:col-9">
                <div class="p-inputgroup">
                    <input pInputText id="ssid" type="text" formControlName="ssid" />
                    <button pButton type="button" icon="pi pi-search" label="Scan" class="p-button-secondary" (click)="scanWifi()" [loading]="scanning"></button>
                </div>
            </div>
        </div>
        <div class="field grid p-fluid">
            <label htmlFor="wifiPass" class="col-12 mb-2 md:col-3 md:mb-0">Password</label>
            <div class="col-12 md:col-9 p-input-icon-right">
                <i *ngIf="form.get('wifiPass')?.dirty" class="pi"
                   [ngClass]="{'pi-eye': !showWifiPassword, 'pi-eye-slash': showWifiPassword}"
                   (click)="toggleWifiPasswordVisibility()" style="cursor: pointer;"></i>
                <input pInputText id="wifiPass" formControlName="wifiPass"
                       [type]="showWifiPassword ? 'text' : 'password'"
                       placeholder="Wi-Fi password" />
            </div>
        </div>

        <div class="form-actions">
            <button pButton type="button" [disabled]="!form.dirty || form.invalid" (click)="updateSystem()">Save</button>
            <span class="form-actions-note">Network changes apply after a restart.</span>
        </div>
    </form>

    <app-modal #wifiScanModal headline="Choose a Wi-Fi network">
        <div class="wifi-scan-list" *ngIf="scannedNetworks.length; else noNetworksFound">
            <button
                *ngFor="let network of scannedNetworks"
                type="button"
                class="wifi-network-button"
                (click)="selectWifiNetwork(network.ssid)">
                <span class="wifi-network-label">{{ network.ssid }}</span>
                <span class="wifi-network-rssi">{{ network.rssi }} dBm</span>
            </button>
        </div>

        <ng-template #noNetworksFound>
            <div class="wifi-scan-empty">
                No Wi-Fi networks in range. Move the miner closer to the router, or type the network name yourself.
            </div>
        </ng-template>
    </app-modal>
</ng-container>
